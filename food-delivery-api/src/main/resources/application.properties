spring.application.name=food-delivery-api

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# MongoDB Configuration
spring.mongodb.uri=mongodb://localhost:27017/food_delivery_db
spring.mongodb.auto-index-creation=true

# File Upload Configuration (for restaurant logos & food photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.org.springframework.data.mongodb=INFO
logging.level.food_delivery_api=DEBUG
