spring.application.name=food-delivery-api

# Server Configuration
server.port=8081
spring.output.ansi.enabled=ALWAYS


# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/food_delivery_db
spring.data.mongodb.auto-index-creation=true
spring.mongodb.uri=mongodb://localhost:27017/food_delivery_db
spring.mongodb.auto-index-creation=true

# File Upload Configuration (for restaurant logos & food photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.org.springframework.data.mongodb=INFO
logging.level.food_delivery_api=DEBUG

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:djalg6hkt}
cloudinary.api-key=${CLOUDINARY_API_KEY:675896959317332}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:9fxNxXuQUOUprJDZNZx0HWyboAQ}

# JWT
app.jwt.secret=${JWT_SECRET:ZKe5+BwNbNuqIhZxJDwox3yKtKCFehgIWhpedZT7nY04n6G2HAyp8MyHOr7If8Y+}
app.jwt.expiration-minutes=60

# Stripe Configuration
